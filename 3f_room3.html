<!DOCTYPE html>

<head>
    <title>

    </title>
    <style>
        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        img {
            width: 1440px;
            pointer-events: none;
            user-select: none;
        }
        .previous {
            position: absolute;
            left: 300px;
            top: 820px;
            width: 228px;
            cursor: pointer;
            pointer-events: auto; /* Enable interaction for the previous button */
        }

        .previous:hover {
            cursor: pointer;
        }
        .exit {
            position: absolute;
            left: 670px;
            top: 650px;
            width: 97px;
            pointer-events: auto; /* Enable interaction for the exit button */
        }
        .square {
            position: absolute;
            background-color: rgba(0, 0, 0, 0); /* Set transparency to 0% */
            box-sizing: border-box;
            cursor: pointer; /* Make pointer clickable on hover */
        }

        .square1 {
            top: calc(600px + 50% - 720px);
            left: calc(70px + 50% - 720px);
            width: 180px;
            height: 300px;
        }

        .square2 {
            top: calc(650px + 50% - 720px);
            left: calc(300px + 50% - 720px);
            width: 100px;
            height: 180px;
        }

        .square3 {
            top: calc(660px + 50% - 720px);
            left: calc(760px + 50% - 720px);
            width: 160px;
            height: 160px;
        }

        .square4 {
            top: calc(620px + 50% - 720px);
            left: calc(1050px + 50% - 720px);
            width: 280px;
            height: 240px;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            width: 900px;
            background-color: transparent;
            text-align: center;
        }

        .popup img {
            width: 100%;
        }

        .click-area {
            position: absolute;
            width: 200px;
            height: 200px;
            bottom: 0;
            right: 0;
            transform: translate(0px, 0px); /* Position relative to the bottom-right corner */
            cursor: pointer;
        }

        .close-area {
            position: absolute;
            width: 100px;
            height: 100px;
            top: 0;
            right: 0;
            transform: translate(0px, 0px); /* Position relative to the top-right corner */
            cursor: pointer;
        }
    </style>
</head>

<body>
    <img src="3f_room3.png" alt="3f Room 3" oncontextmenu="return false;">
    <a href="3f_room2.html">
